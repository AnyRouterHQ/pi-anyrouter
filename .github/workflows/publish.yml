name: publish

on:
  push:
    tags:
      - "v0.1.*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Refuse a version outside the 0.1.x line
        run: node -e 'const v=require("./package.json").version; if(!/^0\.1\.\d+/.test(v)) { console.error(v+" is outside 0.1.x"); process.exit(1) }'
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
